# Docs build for sv-weave/sv-weave-uvm on Forgejo Actions.
#
# THIS IS THE ONLY THING THAT PUBLISHES THESE DOCS. dvkit.org owns all
# documentation for the estate: this repo's docs land at dvkit.org/sv-weave/sv-weave-uvm/.
# dvkit.org is a single Cloudflare Pages project and a deploy replaces the
# WHOLE site, so there is exactly one publisher for it.
#
# What happens after this job, all of it host-side:
#
#   docs-fetch sv-weave/sv-weave-uvm main    # artifact -> staging/
#   docs-promote / docs-deploy           # -> dvkit.org/sv-weave/sv-weave-uvm/
#
# The built HTML leaves as an ARTIFACT and nothing else. This job holds no
# Cloudflare token: a workflow file is public and editable by anyone who can push.
#
# NO RELEASE-AUTHORITY GATE, deliberately. That switch decides who publishes
# PACKAGES. Docs are not a release: they publish from Forgejo regardless of who
# holds release authority.
#
# The doc toolchain is the package's own `docs` extra (pyproject.toml), installed
# together with sv-weave-uvm itself (and, through it, sv-weave from PyPI):
# docs/conf.py imports sv_weave_uvm for the version and the binding's feature
# table. A local build and this one therefore use the same list.
#
# Constraints this file is shaped by, all measured on this instance:
#
#  1. No third-party actions. A bare `uses:` resolves against code.forgejo.org,
#     not github.com, so actions/setup-python does not exist here.
#     `ubuntu-latest` maps to catthehacker/ubuntu:act-22.04.
#  2. `python` unqualified DOES NOT EXIST in that image. Use python3.
#  3. Python is 3.10 and its pip predates PEP 660. sv-weave needs pyslang 12,
#     which needs Python >= 3.11, so this job installs python3.11 from apt and
#     builds in a venv made with it (never `pip install -e`).
#  4. The artifact name is the `docs-<org>-<repo>` convention docs-fetch matches
#     on, and `path: .../**` makes the build directory the ZIP ROOT --
#     docs-fetch refuses an artifact with no index.html at the top level.

name: Docs

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for internal identifiers in tracked files
        # This repo is published to git.dvkit.org and mirrored to GitHub, so
        # anything committed here is public. Excludes the whole
        # .forgejo/workflows directory: ci.yml beside this file carries the
        # same pattern.
        run: |
          pattern='perch-char\.ts\.net|\.ts\.net|a9550|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
          if git grep -nIE "$pattern" -- . ':!.forgejo/workflows/' ; then
            echo "::error::internal identifier found in a tracked file (see matches above)"
            exit 1
          fi
          echo "OK: no internal identifiers in tracked files"

      - name: Install Python 3.11
        # sv-weave needs pyslang 12, which requires Python >= 3.11; this image's
        # python3 is 3.10. Ubuntu 22.04 packages python3.11 (3.11.0rc1, which pip
        # treats as 3.11.0). The container runs as root and is discarded.
        run: |
          apt-get update -qq
          apt-get install -y -qq python3.11 python3.11-venv > /dev/null
          python3.11 --version

      - name: Install sv-weave-uvm and the documentation toolchain
        # --break-system-packages is a FALLBACK: some rebuilds of the runner image
        # mark the interpreter externally-managed (PEP 668).
        run: |
          pip_install() {
            ./py/bin/python3 -m pip install -q "$@" && return 0
            ./py/bin/python3 -m pip install -q --break-system-packages "$@"
          }
          python3.11 -m venv py
          pip_install --upgrade pip setuptools wheel
          pip_install ".[docs]"
          ./py/bin/python3 -c "import sphinx, sphinx_rtd_theme, sv_weave, sv_weave_uvm; print('doc toolchain importable')"

      - name: Build HTML docs
        # -W --keep-going: a missing extension, a broken cross-reference or a
        # generated page that fails to render is an error, not a warning.
        run: |
          ./py/bin/python3 -m sphinx -W --keep-going -b html docs docs/_build/html

      - name: Sanity-check the build
        # Sphinx exits 0 on a build that produced almost nothing, and an empty
        # doc set is worse than a failed one because it deploys.
        run: |
          test -s docs/_build/html/index.html \
            || { echo "::error::no index.html in the build output"; exit 1; }
          n=$(find docs/_build/html -name '*.html' | wc -l)
          echo "generated pages: $n"
          # The floor catches a COLLAPSED build, not a deleted page: index,
          # quickstart and the user guide pages.
          [ "$n" -ge 4 ] || { echo "::error::only $n pages built"; exit 1; }

      - name: Upload docs
        # Consumed by the host-side poller:
        #   docs-fetch sv-weave/sv-weave-uvm main
        uses: forgejo/upload-artifact@v4
        with:
          name: docs-sv-weave-sv-weave-uvm
          path: docs/_build/html/**
          if-no-files-found: error
